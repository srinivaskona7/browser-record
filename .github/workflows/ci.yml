name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify static paths
        run: npm run smoke

      # Proves the Cloudflare preparation works on the same artifact CI built:
      # gzip round trip, dynamic WASM discovery, header rules and size limits.
      - name: Verify Cloudflare asset preparation
        run: npm run verify:cloudflare

      - name: Upload build output for inspection
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
